name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: PdfEditor-linux-x64
          - os: windows-latest
            rid: win-x64
            artifact: PdfEditor-win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --no-restore

      - name: Publish
        run: dotnet publish src/PdfEditor/PdfEditor.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o out/${{ matrix.artifact }}

      - name: Zip artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: zip -r ${{ matrix.artifact }}.zip out/${{ matrix.artifact }}/

      - name: Zip artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path out/${{ matrix.artifact }}/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: ${{ matrix.artifact }}.zip
