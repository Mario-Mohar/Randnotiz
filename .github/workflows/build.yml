name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Bewusst festgenagelt und bewusst auf das AELTESTE noch
          # unterstuetzte Bild, nicht ubuntu-latest: hier entsteht ein
          # self-contained Build, der auf fremden Rechnern laufen muss. Die
          # glibc des Bauwirts ist die Mindestanforderung der fertigen Datei.
          #
          # ubuntu-latest wird ab dem 19.10.2026 Ubuntu 26.04
          # (actions/runner-images#14748). Damit waere die Anforderung still von
          # glibc 2.39 auf 2.43 gestiegen, ohne dass ein Lauf rot wird und ohne
          # dass es jemandem auffaellt, bis ein Nutzer die Datei nicht starten
          # kann. Beide Werte am 2026-09-27 auf den Runnern gemessen.
          - os: ubuntu-24.04
            rid: linux-x64
            artifact: Randnotiz-linux-x64
          - os: windows-latest
            rid: win-x64
            artifact: Randnotiz-win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --no-restore

      - name: Publish
        run: >
          dotnet publish src/PdfEditor/PdfEditor.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/${{ matrix.artifact }}

      - name: Set executable bit and zip (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          chmod +x out/${{ matrix.artifact }}/Randnotiz
          printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" && pwd)"\n"$DIR/Randnotiz" "$@"\n' \
            > out/${{ matrix.artifact }}/Randnotiz.sh
          chmod +x out/${{ matrix.artifact }}/Randnotiz.sh
          cd out/${{ matrix.artifact }}
          zip -r ../../${{ matrix.artifact }}.zip Randnotiz Randnotiz.sh

      - name: Zip artifact (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path out/${{ matrix.artifact }}/Randnotiz.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: ${{ matrix.artifact }}.zip
