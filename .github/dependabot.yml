# Dependabot keeps an eye on the dependencies and opens a pull request when one
# of them moves. Two deliberate choices to keep that from turning into noise:
# monthly rather than weekly, and everything grouped into a single pull request
# per ecosystem instead of one per package. The limit is there so a month with
# many releases cannot bury the repository.

version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      deps:
        patterns: ["*"]
    # PDFsharp steht ab 6.5 unter AGPL-3.0 statt MIT und verlangt eine geladene
    # Lizenz, sonst wirft es PdfSharpLicenseException (9 Tests scheiterten in #25).
    # Wir bleiben bewusst bei der MIT-Reihe 6.2.x; Patches darin kommen weiter.
    ignore:
      - dependency-name: "PDFsharp"
        versions: [">= 6.5.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
